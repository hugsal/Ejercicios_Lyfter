<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Habitos de lectura</title>
  </head>
  <body>
    <h1>Habitos de lectura</h1>
    <form action="resumen.html">
      <label for="nombre">Nombre:</label>
      <br />
      <input type="text" id="nombre" name="nombre" />
      <br />
      <label for="age">Edad:</label>
      <br />
      <input type="text" id="age" name="age" />
      <br />
      <label>Con que frecuencia lees?</label>
      <br />
      <fieldset>
        <input type="radio" id="diario" name="frecuencia" />
        <label for="diario">Diario</label>
        <br />
        <input type="radio" id="semanal" name="frecuencia" />
        <label for="semanal">Semanal</label>
        <br />
        <input type="radio" id="never" name="frecuencia" />
        <label for="never">Casi nunca</label>
      </fieldset>
      <br />
      <label for="recomendations">¿Qué tipo de libros recomiendas leer?</label>
      <br />
      <textarea id="recomendations" name="recomendations" rows="10"></textarea>
      <br />
      <br />
      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
