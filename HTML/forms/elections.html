<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Elecciones</title>
  </head>
  <body>
    <h1>Elecciones</h1>
    <form action="https://www.google.com">
      <label for="nombre">Nombre completo:</label>
      <br />
      <input type="text" id="nombre" name="nombre" />
      <br />
      <label for="email">Correo electronico:</label>
      <br />
      <input type="email" id="email" name="email" />
      <br />
      <label for="userId">Identificacion:</label>
      <br />
      <input type="text" id="userId" name="userId" />
      <br />
      <label for="phoneNumber">Telefono:</label>
      <br />
      <input type="text" id="phoneNumber" name="phoneNumber" />
      <br />
      <label for="candidate">Candidato:</label>
      <br />
      <select id="candidate" name="candidate">
        <option hidden>Selecciona uno</option>
        <option value="1">Candidato #1</option>
        <option value="2">Candidato #2</option>
        <option value="3">Candidato #3</option>
      </select>
      <br />
      <br />
      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
