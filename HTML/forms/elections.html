<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Elecciones</title>
  </head>
  <body>
    <h1>Elecciones</h1>
    <form action="https://www.google.com">
      <label for="nombre">Nombre completo:</label>
      <br />
      <input type="text" id="nombre" name="nombre" />
      <br />
      <label for="email">Correo electronico:</label>
      <br />
      <input type="email" id="email" name="email" />
      <br />
      <label for="userId">Identificacion:</label>
      <br />
      <input type="text" id="userId" name="userId" />
      <br />
      <label for="phoneNumber">Telefono:</label>
      <br />
      <input type="text" id="phoneNumber" name="phoneNumber" />
      <br />
      <label for="candidate">Candidato:</label>
      <br />
      <fieldset>
        <input type="radio" id="candidate1" name="candidate" value="1" />
        <label for="candidate1">Candidato #1</label>
        <br />
        <input type="radio" id="candidate2" name="candidate" value="2" />
        <label for="candidate2">Candidato #2</label>
        <br />
        <input type="radio" id="candidate3" name="candidate" value="3" />
        <label for="candidate3">Candidato #3</label>
      </fieldset>
      <br />
      <br />
      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
