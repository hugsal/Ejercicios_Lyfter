<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Print</title>
    <script src="main.js" defer></script>
  </head>
  <body>
    <form id="form-employee">
      <label for="nombre">Nombre:</label>
      <br />
      <input type="text" id="nombre" name="nombre" />
      <br />
      <label for="nombre">Apellidos:</label>
      <br />
      <input type="text" id="apellidos" name="apellidos" />
      <br />
      <label for="email">Correo electronico:</label>
      <br />
      <input type="email" id="email" name="email" />
      <br />
      <label for="userId">Contrasena:</label>
      <br />
      <input type="text" id="contrasena" name="contrasena" />
      <br />
      <label for="userId" id="label-extra">Campo extra:</label>
      <br />
      <input type="text" id="extra" name="extra" />
      <br />
      <label for="candidate">Empleado?</label>
      <br />
      <fieldset>
        <input type="radio" name="empleado" value="1" checked />
        <label for="empleado1">Si</label>
        <br />
        <input type="radio" name="empleado" value="0" />
        <label for="empleado2">No</label>
      </fieldset>
    </form>
  </body>
</html>
