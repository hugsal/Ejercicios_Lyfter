<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tabla.css" />
    <title>Billboard Hot 100</title>
  </head>
  <body>
    <div class="chart-container">
      <div class="chart-header">
        <h1 class="chart-title">Billboard Hot 100™</h1>
        <div class="chart-date">WEEK OF FEBRUARY 10, 2024</div>
      </div>
      <table class="chart-table">
        <thead>
          <tr>
            <th class="col-this-week" colspan="2">THIS WEEK</th>
            <th>AWARD <span class="info-icon">i</span></th>
            <th>LAST WEEK</th>
            <th>PEAK POS.</th>
            <th>WKS ON CHART</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="col-rank">1</td>
            <td class="col-song-info">
              <div class="song-container">
                <img
                  src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150&auto=format&fit=crop&q=80"
                  alt="Hiss"
                  class="album-img"
                />
                <div class="song-details">
                  <span class="badge-new">NEW</span>
                  <div class="song-text">
                    <span class="song-title">Hiss</span>
                    <span class="artist-name">Megan Thee Stallion</span>
                  </div>
                </div>
                <span class="add-icon">+</span>
              </div>
            </td>
            <td class="col-stat bg-shaded">
              <div class="award-circle">★</div>
            </td>
            <td class="col-stat bg-white">-</td>
            <td class="col-stat bg-shaded">1</td>
            <td class="col-stat bg-white">1</td>
          </tr>
          <tr>
            <td class="col-rank">2</td>
            <td class="col-song-info">
              <div class="song-container">
                <img
                  src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150&auto=format&fit=crop&q=80"
                  alt="Lovin On Me"
                  class="album-img"
                />
                <div class="song-details">
                  <span class="badge-arrow-down">↓</span>
                  <div class="song-text">
                    <span class="song-title">Lovin On Me</span>
                    <span class="artist-name">Jack Harlow</span>
                  </div>
                </div>
                <span class="add-icon">+</span>
              </div>
            </td>
            <td class="col-stat bg-shaded"></td>
            <td class="col-stat bg-white">1</td>
            <td class="col-stat bg-shaded">1</td>
            <td class="col-stat bg-white">12</td>
          </tr>
          <tr>
            <td class="col-rank">3</td>
            <td class="col-song-info">
              <div class="song-container">
                <img
                  src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=150&auto=format&fit=crop&q=80"
                  alt="Cruel Summer"
                  class="album-img"
                />
                <div class="song-details">
                  <span class="badge-arrow-down">↓</span>
                  <div class="song-text">
                    <span class="song-title">Cruel Summer</span>
                    <span class="artist-name">Taylor Swift</span>
                  </div>
                </div>
                <span class="add-icon">+</span>
              </div>
            </td>
            <td class="col-stat bg-shaded"></td>
            <td class="col-stat bg-white">2</td>
            <td class="col-stat bg-shaded">1</td>
            <td class="col-stat bg-white">39</td>
          </tr>
          <tr>
            <td class="col-rank">4</td>
            <td class="col-song-info">
              <div class="song-container">
                <img
                  src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150&auto=format&fit=crop&q=80"
                  alt="Lose Control"
                  class="album-img"
                />
                <div class="song-details">
                  <span class="badge-arrow-right">→</span>
                  <div class="song-text">
                    <span class="song-title">Lose Control</span>
                    <span class="artist-name">Teddy Swims</span>
                  </div>
                </div>
                <span class="add-icon">+</span>
              </div>
            </td>
            <td class="col-stat bg-shaded">★</td>
            <td class="col-stat bg-white">4</td>
            <td class="col-stat bg-shaded">4</td>
            <td class="col-stat bg-white">25</td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
